spring:
  application:
    name: DocRaptor

  profiles:
    active: local

  ai:
    openai:
      base-url: ${API_URL}
      api-key: ${API_KEY}
      chat:
        model: ${ai.model.chat}
      embedding:
        model: ${ai.model.embedding}
        dimensions: 1536
    # 本项目不使用 Spring AI 的 PgVectorStore（统一节点表 summary_nodes 已自带 HNSW 索引），
    # 显式关掉其建表行为，避免在 doc_raptor_db 里创建多余的 vector_store 表。
    vectorstore:
      pgvector:
        initialize-schema: false

  # 连接数据库
  datasource:
    url: jdbc:postgresql://${pg.host}:${pg.port}/${pg.database}
    username: ${pg.user}
    password: ${pg.password}
    driver-class-name: org.postgresql.Driver

  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB

# MyBatis配置
mybatis:
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapper-locations: classpath*:mapper/**/*.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# ============================================================================
# DocRaptor 业务配置（developer 追加，对应 docs/01-architecture.md 第 8 节配置表）
# 均为「接口未传参时的默认值」；实际建树使用的聚类参数会写入 summary_nodes.metadata
# ============================================================================
docraptor:
  chunk:
    size: 512
    overlap: 64
    strategy: FIXED_SIZE
    min-chunk-chars: 32
    normalize-whitespace: true
  embedding:
    # ⚠️ 服务端硬上限：本项目的 embedding 端点单次最多接受 20 条
    # （实测 batch=20 成功、batch=21 起报 400 "batch size is invalid, it should not be larger than 20"）。
    # 超大文档会切成几百块（实测 376 块），全靠这里的分批切片，不能一次全送。
    batch-size: 16
    dimensions: 1536
    max-retries: 3
    retry-backoff-ms: 1000
    timeout-ms: 30000
  raptor:
    max-level: 3
    # 簇数上限约束：kMax = min(max-clusters, 绝对上限, n / min-cluster-size, n)，默认 8。
    # 作用是把「局部阶段 kMax = n → BIC 选 k=n → 每点自成一簇」压住。
    # ⚠️ 它只影响簇数上限；TreeBuildGuard 阈值与落库前小簇合并固定用 2（避免压掉树深/二次压低簇数）。
    min-cluster-size: 1
    summary-concurrency: 4
    rebuild-on-conflict: true
    # 降维方式：PCA（默认，确定性）/ UMAP（官方，但 Smile 侧无法播种）/ NONE（仅调试）。
    # 官方 Python 的 umap.UMAP(...) 也没设 random_state，Smile 的 UMAP 连种子参数都没有 ——
    # 实测同一份 313×1536 embedding 连跑 3 次输出逐位不同（k 在 2~12 跳变），树不可复现。
    # 要复现官方随机行为可显式改成 UMAP。
    reduction: PCA
    # 官方 reduction_dimension = 10。改造前是 2（配合下面的硬顶把 313 块压成 3 个簇、树只剩 2 层）。
    reduction-dimension: 10
    # 官方 threshold = 0.1：软聚类，责任度 > 0.1 的簇**全部**归属（一个节点可属于多个簇）。
    threshold: 0.1
    # 官方两级聚类：全局降维+GMM → 逐全局簇再降维+再 GMM。这是此前完全缺失的一环。
    two-stage: true
    # 官方 max_length_in_cluster。语义：<0 关闭递归细分；0（默认）= 按块大小自动折算；>0 字面 token 数。
    # ⚠️ 不要照搬官方的 3500：官方的 3500 是按它自己约 100 token 的块标定的（= 单簇约 35 块）。
    # 我们的块是 700 中文字符 ≈ 470~670 token，照搬 3500 只容得下 5~7 块，递归细分会把簇切碎
    # （313 块实测：3500 → 102 簇、24% 单节点簇；20000 → 47 簇、2% 单节点簇）。
    max-cluster-tokens: 0
    # 自动折算时「单簇可容纳的块数」：35 × 中位数(每块 token) ≈ 16k~23k
    nodes-per-cluster-at-cap: 35
    # true → 全局 n-neighbors = int(sqrt(n-1))（官方行为；n=313 → 17）。
    auto-global-n-neighbors: true
    global-n-neighbors: 0
    # 官方局部 num_neighbors = 10。
    local-n-neighbors: 10
    umap:
      enabled: true
      # ⚠️ 必须 < 当前层节点数：nNeighbors >= n 时 shouldReduce 为 false，会直接跳过降维。
      # 仅在 auto-global-n-neighbors=false 且 reduction=UMAP 时作为全局值使用。
      n-neighbors: 5
      min-dist: 0.05
      # ⚠️ 目标维度受严格约束 2d+3 < n（Smile 4.1.0 谱初始化 NEV=2d+3）。
      # n=11 时 d 只能是 2 或 3；取 10 会抛 Invalid NEV parameter，降级后 GMM 在 1536 维必然失败 → 单簇 → 树无层次。
      n-components: 2
      metric: cosine
      epochs: 200
      learning-rate: 1.0
      spread: 1.0
      negative-samples: 5
      repulsion-strength: 1.0
      local-connectivity: 1.0
      # 注意：smile 4.1.0 的 smile.manifold.UMAP 没有随机种子参数，无法固定随机性
      random-state: 42
    gmm:
      # 官方 max_clusters = 50（改造前是 8，配合下面的绝对硬顶把 313 块压成 3 个簇）。
      max-clusters: 50
      # 簇数「绝对」上限。默认 0 = 不设限（与官方一致）。
      # 改造前默认 6，是为了堵住「Smile GMM 无法播种 + BIC 一路选到上限」；现在随机性已由
      # DeterministicGmm 解决，这个硬顶反而有害（它正是「只有 3 个簇」的原因之一），故默认关闭。
      absolute-max-clusters: 0
      min-clusters: 2
      # 协方差类型：full（默认，官方 sklearn 默认）/ diagonal。
      # ⚠️ 必须 full：对角协方差每分量只要 2d 个参数，在「样本几十、维度 10」的局部子集上会被
      # 「一个分量钉住一个点」的坍缩解骗过去（实测 logL 变正、50 个点切成 50 个单点簇）；
      # 全协方差每分量 d + d(d+1)/2 个参数（d=10 时 55 个）足以压住。官方 sklearn 工具链同装置实测：
      # 全协方差 → 43 簇、最大 11%；对角 → 315 簇、最大 3%。
      covariance-type: full
      random-state: 42
      # 拟合配置，默认逐项对应 sklearn GaussianMixture 的默认值。
      standardize: false
      max-iterations: 100
      tolerance: 0.001
      regularization: 0.000001
      selection: BIC
  summary:
    max-summary-chars: 400
    max-input-chars: 12000
    max-retries: 3
    temperature: 0.2
    enable-thinking: false
    max-tokens: 1024
    degraded-member-chars: 200
  retrieval:
    default-mode: HYBRID
    default-top-k: 10
    max-top-k: 100
    default-similarity-threshold: 0.0
    default-hybrid-ratio: 0.5
    default-bm25-weight: 1.0
    default-rrf-k: 60
    default-scope: ALL_LEVELS
    candidate-multiplier: 3
    candidate-max: 200
    hnsw-ef-search: 100
    fold-tree: true
    log-enabled: true
  import-config:
    storage-dir: ./data/upload
    max-file-size-mb: 10
    allowed-extensions: pdf,docx,md,markdown,txt
    max-parse-chars: 2000000
    auto-build-tree: true
  async:
    core-pool-size: 2
    max-pool-size: 4
    queue-capacity: 100
    heartbeat-stale-seconds: 300
  eval:
    default-k-list: 1,3,5,10
    max-sync-cases: 50

